{% extends "base.html" %}
{% block content %}
  <div class="card auth-card form-wrapper">
    <h2>Вход</h2>
    <form method="post">
      {% csrf_token %}
      <p><input name="username" type="text" placeholder="Логин"></p>
      <p><input name="password" type="password" placeholder="Пароль"></p>
      <button type="submit">Войти</button>
    </form>
    <p class="muted"><a href="{% url 'users:register' %}">Регистрация</a></p>
  </div>
{% endblock %}
