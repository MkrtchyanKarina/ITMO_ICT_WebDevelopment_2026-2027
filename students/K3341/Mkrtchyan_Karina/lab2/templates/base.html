<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --border: #e5e7eb;
      --accent: #eef2ff;
      --danger: #dc2626;
      --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .06);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }

    a { color: var(--primary); text-decoration: none; transition: color .15s ease; }
    a:hover { color: var(--primary-dark); text-decoration: underline; }

    /* ---------- Шапка ---------- */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .navbar__inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--ink);
      margin-right: auto;
      letter-spacing: .2px;
    }
    .brand:hover { color: var(--primary); text-decoration: none; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: .95rem;
    }

    .nav-links a {
      padding: 6px 12px;
      border-radius: 8px;
      color: var(--ink);
    }
    .nav-links a:hover {
      background: var(--accent);
      color: var(--primary-dark);
      text-decoration: none;
    }

    .nav-user {
      color: var(--muted);
      font-size: .9rem;
      padding: 0 4px;
    }

    /* ---------- Контент ---------- */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    h1, h2, h3 { color: var(--ink); line-height: 1.25; }
    h2 { font-size: 1.5rem; margin: 0 0 18px; }
    h3 { font-size: 1.15rem; margin: 22px 0 12px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 20px;
    }

    /* ---------- Кнопки ---------- */
    .btn, button {
      display: inline-block;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 9px 18px;
      background: var(--primary);
      color: #fff;
      transition: background .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    .btn:hover, button:hover { background: var(--primary-dark); color: #fff; text-decoration: none; }
    button:active { transform: translateY(1px); }

    .btn--ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn--ghost:hover { background: #f3f4f6; color: var(--ink); }

    /* ---------- Формы ---------- */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="number"],
    textarea,
    select {
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      width: 100%;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .15);
    }

    /* Django form.as_p / as_ul внутри .form-wrapper */
    .form-wrapper p { margin: 0 0 14px; }
    .form-wrapper label {
      display: block;
      font-weight: 600;
      font-size: .9rem;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .form-wrapper .helptext,
    .form-wrapper span.helptext {
      display: block;
      color: var(--muted);
      font-size: .82rem;
      margin-top: 4px;
    }
    .form-wrapper ul.errorlist {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      color: var(--danger);
      font-size: .85rem;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .toolbar input[type="text"] { flex: 1 1 260px; width: auto; }

    /* ---------- Таблицы ---------- */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--surface);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .93rem;
    }
    thead th {
      background: var(--accent);
      color: var(--primary-dark);
      text-align: left;
      font-weight: 600;
      padding: 12px 14px;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafaff; }
    tbody td small { color: var(--muted); }

    .empty-row { text-align: center; color: var(--muted); padding: 24px !important; }

    /* ---------- Прочее ---------- */
    .meta p { margin: 6px 0; }
    .meta b { color: var(--ink); }

    .penalties {
      list-style: none;
      padding: 0;
      margin: 6px 0;
    }
    .penalties li {
      display: inline-block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 999px;
      padding: 3px 12px;
      margin: 0 6px 6px 0;
      font-size: .85rem;
    }

    .grade-value {
      display: inline-block;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--accent);
      border-radius: 12px;
      padding: 6px 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--muted);
      font-weight: 600;
    }
    .back-link:hover { color: var(--primary); text-decoration: none; }

    .muted { color: var(--muted); }

    .pagination {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
      font-size: .9rem;
    }
    .pagination a, .pagination .pagination__current {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      min-width: 38px;
      text-align: center;
    }
    .pagination a:hover { background: var(--accent); text-decoration: none; }
    .pagination .pagination__current {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .pagination .pagination__gap { color: var(--muted); padding: 6px 2px; }
    .pagination span { color: var(--muted); }

    .auth-card { max-width: 420px; margin: 20px auto; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <a class="brand" href="/">Домашние задания</a>
      <nav class="nav-links">
        {% if user.is_authenticated %}
          <span class="nav-user">Привет, {{ user.username }}</span>
          <a href="{% url 'homework:list' %}">Задания</a>
          {% if user.is_staff %}
            <a href="{% url 'homework:grade_table' %}">Оценки</a>
          {% endif %}
          <a href="{% url 'users:logout' %}">Выйти</a>
        {% else %}
          <a href="{% url 'users:login' %}">Войти</a>
          <a href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
